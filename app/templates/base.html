<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spendly{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{{ url_for('main.dashboard') }}">
                <span class="brand-mark">₹</span>
                <span>Spendly</span>
            </a>

            <div class="header-actions">
                <a class="button button-secondary" href="{{ url_for('main.create_income') }}">
                    <span>↑</span>
                    <span>Add income</span>
                </a>
                <a class="button button-primary" href="{{ url_for('main.create_expense') }}">
                    <span>+</span>
                    <span>Add expense</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-stack">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <!-- Shared confirmation modal, used by any form with class="delete-form" -->
    <div class="modal-overlay" id="confirmOverlay">
        <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
            <h3 id="confirmTitle">Delete this entry?</h3>
            <p id="confirmMessage">This action can't be undone.</p>
            <div class="modal-actions">
                <button type="button" class="button button-ghost" id="confirmCancel">Cancel</button>
                <button type="button" class="button modal-danger" id="confirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
